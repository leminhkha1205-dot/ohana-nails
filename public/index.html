<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nail SEO Image Metadata Editor</title>
  <style>
    :root{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:#111827;background:#f5f7fb} body{margin:0;padding:24px}.wrap{max-width:1120px;margin:auto}.card{background:white;border-radius:18px;padding:22px;margin:0 0 18px;box-shadow:0 12px 35px #11182712}h1{margin:0 0 8px;font-size:28px}.muted{color:#6b7280}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.pill{background:#f2f4f8;border-radius:12px;padding:12px}.pill b{display:block}.drop{border:2px dashed #cbd5e1;border-radius:16px;padding:18px;background:#fbfdff}.item{display:grid;grid-template-columns:110px 1fr;gap:14px;border:1px solid #e5e7eb;border-radius:14px;padding:12px;margin:12px 0}.item img{width:100px;height:100px;object-fit:cover;border-radius:10px;border:1px solid #e5e7eb}textarea,input,select{width:100%;box-sizing:border-box;border:1px solid #d1d5db;border-radius:10px;padding:10px;font:inherit;background:white}textarea{min-height:90px}.btn{background:#2563eb;color:white;border:0;border-radius:12px;padding:13px 18px;font-weight:700;font-size:16px}.btn:disabled{background:#9ca3af}.err{color:#9f1239;font-weight:700}.ok{color:#166534;font-weight:700}.links a{display:inline-block;margin:6px 10px 0 0}.api{display:grid;grid-template-columns:1fr auto;gap:10px;margin-top:12px}.selector{display:grid;grid-template-columns:260px 1fr;gap:12px;align-items:end;margin:16px 0 12px}.note{background:#fffbeb;border:1px solid #fde68a;border-radius:12px;padding:12px;color:#92400e}@media(max-width:800px){body{padding:12px}.grid{grid-template-columns:repeat(2,1fr)}.item{grid-template-columns:1fr}.item img{width:100%;height:180px}.api,.selector{grid-template-columns:1fr}}
  </style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>Nail SEO Image Metadata Editor</h1>
    <p class="muted">Bản online dùng backend ExifTool. Chọn template salon, upload ảnh JPG, nhập Keywords cho từng ảnh rồi tải ảnh đã ghi EXIF/IPTC/XMP.</p>

    <div class="selector">
      <label><b>Chọn template</b><select id="templateKey"><option value="ohana">Ohana Nails</option><option value="rainbow">Rainbow Nails</option></select></label>
      <div class="note" id="templateNote">Ohana Nails: có sẵn GPS Long Beach.</div>
    </div>

    <div class="grid" id="templatePreview"></div>

    <div class="api">
      <input id="apiBase" placeholder="API URL, ví dụ: https://your-app.onrender.com hoặc để trống nếu đang mở trực tiếp trên server" />
      <button class="btn" id="testBtn" type="button">Test API</button>
    </div>
    <p id="apiStatus" class="muted"></p>
  </div>

  <div class="card">
    <div class="drop">
      <input id="files" type="file" accept="image/jpeg,.jpg,.jpeg" multiple />
    </div>
    <p class="muted">Chỉ nên dùng JPG/JPEG để GeoSetter đọc đầy đủ EXIF/IPTC/XMP. Rating mặc định: 5 sao.</p>
    <div id="list"></div>
    <button id="process" class="btn" disabled>Ghi metadata & tải ảnh</button>
    <p id="status"></p>
    <div id="downloads" class="links"></div>
  </div>
</div>
<script>
const filesEl = document.getElementById('files');
const listEl = document.getElementById('list');
const processBtn = document.getElementById('process');
const statusEl = document.getElementById('status');
const downloadsEl = document.getElementById('downloads');
const apiBaseEl = document.getElementById('apiBase');
const apiStatus = document.getElementById('apiStatus');
const templateKeyEl = document.getElementById('templateKey');
const templatePreview = document.getElementById('templatePreview');
const templateNote = document.getElementById('templateNote');
let currentFiles = [];

const TEMPLATES = {
  ohana: {
    label: 'Ohana Nails',
    gps: '33.795688, -118.10855270',
    location: 'Long Beach, California 90815, USA',
    brand: 'Ohana Nails',
    url: 'https://ohananailslongbeach.com/',
    caption: 'Nail salon 90815 | Ohana Nails | Long Beach, California 90815',
    contact: '2221 Palo Verde Ave # 1AA · (562) 493-4606',
    email: '',
    note: 'Ohana Nails: có sẵn GPS Long Beach.'
  },
  rainbow: {
    label: 'Rainbow Nails',
    gps: '33.84709830, -117.98671080',
    location: 'Buena Park, California 90620, USA',
    brand: 'Rainbow Nails',
    url: 'https://rainbownailspa.com/',
    caption: 'Nail salon 90620 | Rainbow Nails | Buena Park, California 90620',
    contact: '8417 La Palma Ave · 714-736-9278',
    email: 'rainbownails8417@gmail.com',
    note: 'Rainbow Nails: có sẵn GPS Buena Park.'
  }
};

function apiBase(){ return (apiBaseEl.value || '').trim().replace(/\/$/, ''); }
function apiUrl(path){ return apiBase() + path; }
function escapeHtml(s){return String(s || '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function activeTemplate(){return TEMPLATES[templateKeyEl.value] || TEMPLATES.ohana;}
function renderTemplate(){
  const t = activeTemplate();
  templateNote.textContent = t.note;
  templatePreview.innerHTML = `
    <div class="pill"><b>GPS</b>${escapeHtml(t.gps)}</div>
    <div class="pill"><b>Location</b>${escapeHtml(t.location)}</div>
    <div class="pill"><b>Brand</b>${escapeHtml(t.brand)}</div>
    <div class="pill"><b>URL</b>${escapeHtml(t.url)}</div>
    <div class="pill"><b>Caption</b>${escapeHtml(t.caption)}</div>
    <div class="pill"><b>Contact</b>${escapeHtml(t.contact)}</div>
    <div class="pill"><b>Email</b>${escapeHtml(t.email || 'Không có')}</div>
    <div class="pill"><b>Rating</b>5 sao</div>`;
}
function render(){
  listEl.innerHTML='';
  const salonName = activeTemplate().label;
  currentFiles.forEach((file, i)=>{
    const url = URL.createObjectURL(file);
    const div = document.createElement('div'); div.className='item';
    div.innerHTML = `<img src="${url}" alt=""><div><b>${escapeHtml(file.name)}</b><p class="muted">Template đang chọn: <b>${escapeHtml(salonName)}</b>. Keywords cho ảnh này, mỗi dòng hoặc cách nhau bằng dấu phẩy.</p><textarea data-index="${i}" placeholder="Ví dụ:\nnails for summer\nsummer nails\nsummer nails 2026"></textarea><p class="muted">Tên file SEO sẽ tự lấy theo keyword đầu tiên.</p></div>`;
    listEl.appendChild(div);
  });
  processBtn.disabled = currentFiles.length === 0;
}
filesEl.addEventListener('change', e=>{ currentFiles=[...e.target.files]; render(); });
templateKeyEl.addEventListener('change', ()=>{ renderTemplate(); render(); downloadsEl.innerHTML=''; statusEl.textContent=''; });
document.getElementById('testBtn').onclick = async()=>{
  apiStatus.textContent = 'Đang test API...'; apiStatus.className='muted';
  try{ const r = await fetch(apiUrl('/api/health')); const j = await r.json(); apiStatus.textContent = j.ok ? `API hoạt động bình thường. Version: ${j.version || ''}` : 'API trả về lỗi.'; apiStatus.className = j.ok ? 'ok':'err'; }
  catch(e){ apiStatus.textContent = 'Không gọi được API. Nếu bạn đang mở file bằng content:// thì cần deploy server hoặc nhập API URL online.'; apiStatus.className='err'; }
};
processBtn.onclick = async()=>{
  statusEl.textContent='Đang upload và ghi metadata...'; statusEl.className='muted'; downloadsEl.innerHTML=''; processBtn.disabled=true;
  const form = new FormData();
  currentFiles.forEach(f=>form.append('images', f, f.name));
  const keywordsMap = {}; document.querySelectorAll('textarea[data-index]').forEach(t=>{ const f=currentFiles[Number(t.dataset.index)]; keywordsMap[f.name]=t.value; });
  form.append('keywordsMap', JSON.stringify(keywordsMap));
  form.append('nameMap', JSON.stringify({}));
  form.append('templateKey', templateKeyEl.value);
  try{
    const r = await fetch(apiUrl('/api/process'), { method:'POST', body:form });
    if(!r.ok) throw new Error(await r.text());
    const j = await r.json(); if(!j.ok) throw new Error(j.error || 'Process failed');
    statusEl.textContent=`Xong. Đã ghi metadata theo template ${j.template}. Bạn có thể tải ảnh bên dưới.`; statusEl.className='ok';
    j.results.forEach(x=>{ const a=document.createElement('a'); a.href=apiUrl(x.url); a.textContent='Tải '+x.output; a.download=x.output; downloadsEl.appendChild(a); });
    const z=document.createElement('a'); z.href=apiUrl(j.zipUrl); z.textContent='Tải ZIP tất cả ảnh'; z.download='nail-seo-images.zip'; downloadsEl.prepend(z);
  }catch(e){ statusEl.textContent='Lỗi: '+(e.message || e); statusEl.className='err'; }
  finally{ processBtn.disabled=false; }
};
renderTemplate();
</script>
</body>
</html>
